<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Сторінку не знайдено — UNO Agency</title>
<meta name="robots" content="noindex, follow"/>
<meta name="theme-color" content="#0E0F10"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;600&family=Onest:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0E0F10;--ink:#F5EFE7;--ink2:#B4ADA3;--line:rgba(245,239,231,.13);--orange:#C24E17;--ember:#FF8A4C}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:400 17px/1.6 'Onest','Segoe UI',system-ui,sans-serif}
main{max-width:560px;width:100%}
.logo{font:600 17px/1 'Geologica','Segoe UI',system-ui,sans-serif;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.logo i{font-style:normal;color:var(--ember)}
.code{font:300 clamp(72px,18vw,132px)/1 'Geologica','Segoe UI',system-ui,sans-serif;letter-spacing:-.03em;color:var(--ember);margin:48px 0 8px}
h1{font:300 clamp(24px,5vw,34px)/1.2 'Geologica','Segoe UI',system-ui,sans-serif;letter-spacing:-.015em;margin:0 0 14px}
p{color:var(--ink2);margin:0 0 32px}
.row{display:flex;flex-wrap:wrap;gap:12px}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 28px;border-radius:999px;font:500 13.5px/1 'Onest','Segoe UI',system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;text-decoration:none}
a.p{background:var(--orange);color:#fff}
a.g{border:1px solid var(--line);color:var(--ink)}
a.btn:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="logo" href="/">UNO <i>Agency</i></a>
  <div class="code" aria-hidden="true">404</div>
  <h1>Такої сторінки немає</h1>
  <p>Посилання застаріло або в адресі є помилка. Поверніться на головну або перегляньте наші кейси.</p>
  <div class="row">
    <a class="btn p" href="/">На головну</a>
    <a class="btn g" href="/cases/">Кейси</a>
    <a class="btn g" href="/eng/" hreflang="en" lang="en">English</a>
  </div>
</main>
</body>
</html>
